name : wf-deploy-development
on :
  push:
    branches:
      - develop
jobs:
  wf-development-build-job :
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: build website
        run: 
          npx parcel build "./src/index.html" --dist-dir"./dist" --public-url "./" 
      - name: upload artifacts
        uses: actions/upload-pages-artifacts@v3
        with:
          path: "./dist"
          name: "develop-artifacts"
  wf-development-deploy-job:  
    runs-on: ubuntu-latest  
    needs: wf-development-build-job 
    permissions :
      pages: write
      id-token: write
    steps:
      - name: deploy build artifacts on GH pages  
        uses: actions/deploy-pages@v4
        with: 
          artifacts-name: "develop-artifacts"
          token: ${{github.token}}
          
        